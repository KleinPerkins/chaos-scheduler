# Lefthook local git hooks — fast, developer-side enforcement.
# These are bypassable (`git commit --no-verify`); GitHub CI (ci-required)
# is the authoritative gate. See CONTRIBUTING.md.
#
# Installed automatically by the `prepare` npm script (`lefthook install`).

commit-msg:
  commands:
    commitlint:
      # Validate the commit message against Conventional Commits.
      run: npx --no-install commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,jsx,cjs,mjs,json,css,md,yml,yaml}"
      run: npx --no-install prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx --no-install eslint --fix {staged_files}
      stage_fixed: true
    data-guard:
      # Refuse database snapshots / secret files (scheduler.db, *.sqlite, .env,
      # Apple .p12, ssh private keys). Local, bypassable defense; the `data-guard`
      # CI job is the authoritative gate and also covers the git-data-API PR flow.
      run: node scripts/check-no-committed-data.mjs {staged_files}
    secret-scan:
      # Scan staged content for committed secrets (high-entropy strings, known API
      # key patterns). Requires `brew install gitleaks` (or equivalent).
      # Local, bypassable defense; the `secret-scan` CI job is the authoritative
      # gate and also covers the git-data-API single-commit PR flow this repo uses.
      run: gitleaks protect --staged --source . --config .gitleaks.toml --redact --verbose
    cargo-fmt:
      root: "src-tauri/"
      glob: "*.rs"
      run: cargo fmt --check
    cargo-clippy:
      root: "src-tauri/"
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings

pre-push:
  parallel: true
  commands:
    typecheck:
      glob: "*.{ts,tsx}"
      run: npm run typecheck
    frontend-unit:
      glob: "{src/**/*.{ts,tsx},vitest.config.ts}"
      run: npm test
    packages-test:
      glob: "packages/**/*.{ts,js}"
      run: npm run test:packages
    cargo-test:
      root: "src-tauri/"
      glob: "*.rs"
      run: cargo test --quiet
